# Homedial Backdrop helpers. Drop into config/packages/ (packages must be enabled), then restart.
# Creates the 4 helpers the dashboard engine reads. Changing them changes looks only, never automations.
# Alert condition: NORMAL, or ALERT (a person, or the Homedial safety alert, turns it on).
# No `initial:` on purpose: HA restores the last value after a restart, so a manual alert stays on
# until someone clears it, and the chosen theme sticks.
input_select:
  dlabs_theme:
    name: Homedial theme
    icon: mdi:palette
    options:
      - "Directive Labs Navy"
      - "Holidays"
      - "Seasons"
